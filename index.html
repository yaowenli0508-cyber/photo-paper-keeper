<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f4ee" />
    <meta name="description" content="记录相纸数量、价格和过期日期" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="styles.css?v=10" />
    <title>相纸管家</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">PHOTO PAPER KEEPER</p>
          <h1>相纸管家</h1>
          <p class="subtitle">每一盒相纸，都用在值得留下的瞬间。</p>
        </div>
        <div class="hero-actions">
          <button class="install-button" id="install-app" type="button">安装</button>
          <button class="icon-button" id="open-form" aria-label="添加相纸">＋</button>
        </div>
      </header>

      <nav class="view-tabs" aria-label="页面切换">
        <button class="active" data-view="inventory">库存明细</button>
        <button data-view="patterns">款式余量</button>
      </nav>

      <div id="inventory-view">
      <div class="summary-label">
        <span>库存概览</span>
        <button id="open-settings" type="button">⚙ 临期标准：<b id="threshold-label">6个月</b></button>
      </div>
      <section class="summary" aria-label="库存概览">
        <article><span>总库存</span><strong id="total-count">0张</strong></article>
        <article><span>库存价值</span><strong id="total-value">¥0</strong></article>
        <article><span>临期提醒</span><strong id="expiring-count">0</strong><small>条</small></article>
        <article><span>最近过期</span><strong id="nearest-expiry">暂无</strong><small id="nearest-name"></small></article>
      </section>

      <section class="toolbar">
        <label class="search">
          <span aria-hidden="true">⌕</span>
          <input id="search-input" type="search" placeholder="搜索品牌、型号或备注" />
        </label>
        <div class="filters" id="filters">
          <button class="active" data-filter="all">全部</button>
          <button data-filter="fresh">状态良好</button>
          <button data-filter="expiring">即将过期</button>
          <button data-filter="expired">已过期</button>
          <button data-filter="low">低库存</button>
        </div>
        <div class="list-controls">
          <label><span>排序</span><select id="sort-select"><option value="expiry-asc">最快过期优先</option><option value="expiry-desc">最晚过期优先</option></select></label>
          <label><span>尺寸</span><select id="model-filter"><option value="all">全部尺寸</option><option value="SQ">SQ</option><option value="mini">mini</option><option value="Wide">Wide</option></select></label>
          <label><span>款式</span><select id="pattern-filter"><option value="all">全部款式</option><option value="base">基础款（白边）</option><option value="floral">全部花边</option><option value="彩虹">彩虹</option><option value="黑边">黑边</option><option value="落日">落日</option><option value="汉白玉">汉白玉</option><option value="星空">星空</option><option value="其他">其他</option></select></label>
        </div>
      </section>

      <section class="inventory-heading">
        <h2>我的相纸</h2>
        <span id="item-count">0 盒</span>
      </section>
      <section id="paper-list" class="paper-list" aria-live="polite"></section>
      </div>

      <section id="patterns-view" class="patterns-view" hidden>
        <div class="pattern-head">
          <div><p class="eyebrow">STYLE OVERVIEW</p><h2>款式余量</h2></div>
          <div class="model-tabs" id="model-tabs">
            <button class="active" data-model="SQ">SQ</button>
            <button data-model="mini">mini</button>
            <button data-model="Wide">Wide</button>
          </div>
        </div>
        <section class="pattern-grid" id="pattern-grid"></section>
        <input id="pattern-image-input" type="file" accept="image/*" hidden />
      </section>
    </main>

    <button class="fab" id="open-form-fab" aria-label="添加相纸">＋</button>

    <dialog id="paper-dialog">
      <form id="paper-form" method="dialog">
        <div class="dialog-head">
          <div><p class="eyebrow">INVENTORY</p><h2 id="form-title">添加相纸</h2></div>
          <button type="button" class="close-button" id="close-form" aria-label="关闭">×</button>
        </div>
        <input type="hidden" id="paper-id" />
        <div class="form-row">
          <label>相纸型号<select id="paper-model"><option>SQ</option><option>mini</option><option>Wide</option></select></label>
          <label>相纸款式<select id="paper-pattern"></select></label>
        </div>
        <label>自定义名称（可选）<input id="paper-name" maxlength="40" placeholder="不填则自动使用型号和款式" /></label>
        <div class="form-row">
          <label>剩余数量<div class="quantity-input"><input id="paper-quantity" type="number" required min="0" step="1" inputmode="numeric" placeholder="1" /><select id="paper-unit" aria-label="数量单位"><option value="盒">盒</option><option value="张">张</option></select></div></label>
          <label>购买价格（元）<input id="paper-price" type="number" required min="0" step="0.01" inputmode="decimal" placeholder="99" /></label>
        </div>
        <fieldset class="date-field">
          <legend>过期日期</legend>
          <div class="date-selects">
            <select id="expiry-year" aria-label="过期年份" required></select>
            <select id="expiry-month" aria-label="过期月份" required></select>
            <select id="expiry-day" aria-label="过期日期" required></select>
          </div>
        </fieldset>
        <label>备注（可选）<textarea id="paper-note" maxlength="120" placeholder="例如：冰箱第二层、旅行备用"></textarea></label>
        <button class="primary-button" type="submit">保存相纸</button>
      </form>
    </dialog>

    <dialog id="settings-dialog" class="settings-dialog">
      <form id="settings-form" method="dialog">
        <div class="dialog-head">
          <div><p class="eyebrow">REMINDER</p><h2>临期提醒设置</h2></div>
          <button type="button" class="close-button" id="close-settings" aria-label="关闭">×</button>
        </div>
        <label>距离过期还有多少个月时标记为危险
          <div class="month-input"><input id="warning-months" type="number" min="1" max="24" step="1" required /><span>个月</span></div>
        </label>
        <div class="quick-months" id="quick-months">
          <button type="button" data-months="3">3个月</button>
          <button type="button" data-months="6">6个月</button>
          <button type="button" data-months="9">9个月</button>
          <button type="button" data-months="12">12个月</button>
        </div>
        <p class="setting-note">例如设置为 6 个月，距离过期不足 6 个月的相纸都会进入“即将过期”。</p>
        <button class="primary-button" type="submit">保存提醒设置</button>
      </form>
    </dialog>

    <dialog id="install-dialog" class="install-dialog">
      <div class="install-content">
        <button type="button" class="close-button" id="close-install" aria-label="关闭">×</button>
        <p class="eyebrow">INSTALL APP</p>
        <h2>安装到 vivo 桌面</h2>
        <p>点击浏览器底部或右上角的菜单按钮，选择：</p>
        <strong>添加到桌面 / 安装应用</strong>
        <p class="install-tip">安装后会像普通 App 一样从桌面打开，并支持离线使用。</p>
      </div>
    </dialog>

    <script src="app.js?v=10"></script>
  </body>
</html>
