name: Build offline Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - styles.css
      - app.js
      - .github/workflows/build-apk.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/com/photopaper/keeper
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-hdpi

          cp index.html styles.css app.js icon.svg android/app/src/main/assets/
          cp app-icon.png android/app/src/main/res/drawable/app_icon.png

          printf '%s\n' 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' 'dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }' 'rootProject.name = "PhotoPaperKeeper"' 'include(":app")' > android/settings.gradle

          printf '%s\n' 'plugins {' '    id "com.android.application" version "8.5.2" apply false' '}' > android/build.gradle

          printf '%s\n' 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' 'android.useAndroidX=true' > android/gradle.properties

          printf '%s\n' 'plugins {' '    id "com.android.application"' '}' '' 'android {' '    namespace "com.photopaper.keeper"' '    compileSdk 35' '' '    defaultConfig {' '        applicationId "com.photopaper.keeper"' '        minSdk 26' '        targetSdk 35' '        versionCode 3' '        versionName "1.2.0"' '    }' '}' > android/app/build.gradle

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:theme="@style/AppTheme" android:label="相纸管家" android:icon="@drawable/app_icon" android:roundIcon="@drawable/app_icon" android:allowBackup="true" android:supportsRtl="true">
              <activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">#DC643F</item>
              <item name="android:navigationBarColor">#F7F4EE</item>
              <item name="android:statusBarColor">#F7F4EE</item>
              <item name="android:windowLightStatusBar">true</item>
            </style>
          </resources>
          EOF

          cat > android/app/src/main/java/com/photopaper/keeper/MainActivity.java <<'EOF'
          package com.photopaper.keeper;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Window;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
            private static final int FILE_CHOOSER_REQUEST = 1001;
            private WebView webView;
            private ValueCallback<Uri[]> filePathCallback;

            @Override public void onCreate(Bundle state) {
              super.onCreate(state);
              Window window = getWindow();
              window.setStatusBarColor(0xfff7f4ee);
              window.setNavigationBarColor(0xfff7f4ee);

              webView = new WebView(this);
              WebSettings settings = webView.getSettings();
              settings.setJavaScriptEnabled(true);
              settings.setDomStorageEnabled(true);
              settings.setAllowFileAccess(true);
              settings.setDatabaseEnabled(true);
              webView.setWebViewClient(new WebViewClient());
              webView.setWebChromeClient(new WebChromeClient() {
                @Override public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                  if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                  filePathCallback = callback;
                  Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                  intent.setType("image/*");
                  startActivityForResult(Intent.createChooser(intent, "选择款式图片"), FILE_CHOOSER_REQUEST);
                  return true;
                }
              });
              webView.loadUrl("file:///android_asset/index.html");
              setContentView(webView);
            }

            @Override protected void onActivityResult(int requestCode, int resultCode, Intent data) {
              super.onActivityResult(requestCode, resultCode, data);
              if (requestCode != FILE_CHOOSER_REQUEST || filePathCallback == null) return;
              Uri[] result = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
              filePathCallback.onReceiveValue(result);
              filePathCallback = null;
            }

            @Override public void onBackPressed() {
              if (webView.canGoBack()) webView.goBack();
              else super.onBackPressed();
            }
          }
          EOF

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk photo-paper-keeper-v1.2.apk

      - uses: actions/upload-artifact@v4
        with:
          name: photo-paper-keeper-apk
          path: photo-paper-keeper-v1.2.apk
          retention-days: 30

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: 相纸管家 Android v1.2.0
          body: 可在 Android 手机本地安装、完全离线使用的相纸管家。
          make_latest: true
          files: photo-paper-keeper-v1.2.apk
